
[package]
name = "sawp-fuzz"
version = "0.0.0"
authors = ["Canadian Centre for Cyber Security <sa-sawp@cyber.gc.ca>"]
publish = false
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.3"
sawp = { path = "..", version = "^0.14.0" }
sawp-modbus = { path = "../sawp-modbus" }
sawp-diameter = { path = "../sawp-diameter" }

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_modbus"
path = "fuzz_targets/fuzz_modbus.rs"
test = false
doc = false

[[bin]]
name = "fuzz_diameter"
path = "fuzz_targets/fuzz_diameter.rs"
test = false
doc = false
